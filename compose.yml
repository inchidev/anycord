name: celld-local-chat
services:
  chat:
    build: .
    ports:
      - "127.0.0.1:9876:9876"
    environment:
      AUTH_BASE_URL: ${AUTH_BASE_URL:-http://127.0.0.1:9876}
    volumes:
      - chat-state:/app/.celld
    mem_limit: 512m
    cpus: 1
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9876/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
volumes:
  chat-state:

name: PR preview
on:
  workflow_dispatch:
    inputs:
      pr:
        description: PR number targeting main
        required: true
        type: string
      sha:
        description: Exact reviewed head SHA (40 characters; required for open PRs)
        required: false
        type: string
      operation:
        description: Deploy/update preview or permanently destroy its test data
        type: choice
        options: [deploy, destroy]
        default: deploy
  # This event only removes closed previews. It never builds or executes PR code.
  pull_request_target:
    types: [closed]
    branches: [main]
permissions: {}
concurrency:
  group: pr-preview-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false
jobs:
  authorize:
    if: github.repository == 'inchidev/anycord' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.authorize.outputs.pr }}
      sha: ${{ steps.authorize.outputs.sha }}
      operation: ${{ steps.authorize.outputs.operation }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/authorize-preview.mjs
  build:
    needs: authorize
    if: needs.authorize.outputs.operation == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: refs/pull/${{ needs.authorize.outputs.pr }}/head
          path: source
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Check reviewed commit before running PR code
        working-directory: source
        env:
          PREVIEW_SHA: ${{ needs.authorize.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$PREVIEW_SHA"
      # This job has no environment and no secrets; it runs on a disposable runner.
      - run: npm ci && npm run verify
        working-directory: source
      - name: Collect only the bundled module and public assets
        env:
          PREVIEW_SHA: ${{ needs.authorize.outputs.sha }}
        run: node trusted/scripts/prepare-preview-build.mjs source preview-bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: preview-${{ needs.authorize.outputs.pr }}-${{ needs.authorize.outputs.sha }}
          path: preview-bundle/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
  deploy:
    needs: [authorize, build]
    if: needs.authorize.outputs.operation == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      checks: write
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: preview-${{ needs.authorize.outputs.pr }}-${{ needs.authorize.outputs.sha }}
          path: preview-bundle
      - id: deploy
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIEW_SECRET_SEED: ${{ secrets.PREVIEW_SECRET_SEED }}
          PREVIEW_PR: ${{ needs.authorize.outputs.pr }}
          PREVIEW_SHA: ${{ needs.authorize.outputs.sha }}
          PREVIEW_OPERATION: deploy
        run: node scripts/manage-preview.mjs
  destroy:
    needs: authorize
    if: needs.authorize.outputs.operation == 'destroy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      checks: write
    environment: preview
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIEW_PR: ${{ needs.authorize.outputs.pr }}
          PREVIEW_SHA: ${{ needs.authorize.outputs.sha }}
          PREVIEW_OPERATION: destroy
        run: node scripts/manage-preview.mjs

name: Scope existing Cloudflare credential
on:
  workflow_dispatch:
    inputs:
      production_key:
        description: GitHub production environment public key (base64)
        required: true
        type: string
      preview_key:
        description: GitHub preview environment public key (base64)
        required: true
        type: string
permissions:
  contents: read
jobs:
  seal:
    if: github.repository == 'inchidev/anycord' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require administrator for credential migration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for login in "$GITHUB_ACTOR" "$GITHUB_TRIGGERING_ACTOR"; do
            gh api "repos/$GITHUB_REPOSITORY/collaborators/$login/permission" --jq '.role_name' | grep -qx admin
          done
      - run: python3 -m pip install PyNaCl==1.5.0
      - name: Seal repository credential for the two protected environments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PRODUCTION_KEY: ${{ inputs.production_key }}
          PREVIEW_KEY: ${{ inputs.preview_key }}
        run: |
          python3 - <<'PY'
          import os, base64, json, pathlib
          from nacl.public import PublicKey, SealedBox
          token = os.environ['CLOUDFLARE_API_TOKEN']
          assert token, 'Repository credential is absent; configure environment secrets directly'
          values = {env: base64.b64encode(SealedBox(PublicKey(base64.b64decode(os.environ[key], validate=True))).encrypt(token.encode())).decode()
                    for env, key in [('production', 'PRODUCTION_KEY'), ('preview', 'PREVIEW_KEY')]}
          pathlib.Path('sealed-cloudflare.json').write_text(json.dumps(values))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scoped-cloudflare-secrets
          path: sealed-cloudflare.json
          retention-days: 1
          if-no-files-found: error
